<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de Pixel TikTok</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --bg:#0f0f12; --card:#1a1a20; --txt:#f2f2f5; --muted:#9a9aa8; --pink:#fe2c55; --cyan:#25f4ee; --ok:#3ddc84; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); padding:24px 16px; }
  .wrap { max-width:520px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--muted); font-size:14px; margin:0 0 20px; }
  .card { background:var(--card); border-radius:14px; padding:18px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #2c2c35; background:#111116; color:var(--txt); font-size:15px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { width:100%; padding:12px; border:0; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; margin-top:10px; background:#2a2a33; color:var(--txt); }
  button.main { background:var(--pink); color:#fff; font-size:16px; padding:14px; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .status { font-size:13px; margin-top:8px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#666; margin-right:6px; }
  .dot.on { background:var(--ok); }
  #log { font-family:ui-monospace,Menlo,monospace; font-size:12px; background:#0b0b0e; border-radius:8px; padding:10px; max-height:220px; overflow:auto; white-space:pre-wrap; color:#cfcfd6; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧪 Teste de Pixel TikTok</h1>
  <p class="sub">Suba este arquivo no seu domínio (ex: seusite.com/teste-pixel.html), abra, e dispare os eventos.</p>

  <div class="card">
    <label>ID do Pixel</label>
    <input id="pixelId" placeholder="Ex: D7XXXXXXXXXXXXXXXXXX">
    <button id="btnLoad">Carregar pixel</button>
    <div class="status"><span class="dot" id="dot"></span><span id="st">Pixel não carregado</span></div>
    <div class="hint">Se esta página já tiver o seu código base, o pixel é detectado sozinho.</div>
  </div>

  <div class="card">
    <div class="row">
      <div><label>Produto (content_id)</label><input id="cid" value="produto-teste"></div>
      <div><label>Nome</label><input id="cname" value="Produto Teste"></div>
    </div>
    <div class="row">
      <div><label>Valor</label><input id="val" type="number" step="0.01" value="1.00"></div>
      <div><label>Moeda</label>
        <select id="cur"><option>BRL</option><option>USD</option><option>MXN</option><option>EUR</option></select>
      </div>
    </div>
    <label>Email (opcional — melhora o match)</label>
    <input id="email" type="email" placeholder="seuemail@teste.com">
    <label>Telefone (opcional, com DDI: +5587...)</label>
    <input id="phone" placeholder="+5587999999999">
  </div>

  <div class="card">
    <button class="ev" data-ev="ViewContent" disabled>ViewContent</button>
    <button class="ev" data-ev="AddToCart" disabled>AddToCart</button>
    <button class="ev" data-ev="InitiateCheckout" disabled>InitiateCheckout</button>
    <button class="ev" data-ev="AddPaymentInfo" disabled>AddPaymentInfo</button>
    <button class="ev main" data-ev="CompletePayment" disabled>💸 CompletePayment (Compra)</button>
    <button class="ev" id="btnFunnel" disabled>▶ Funil completo (todos em sequência)</button>
  </div>

  <div class="card">
    <label>Log</label>
    <div id="log">Aguardando…</div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var logEl = $('log');
  function log(msg){
    var t = new Date().toLocaleTimeString('pt-BR');
    if (logEl.textContent === 'Aguardando…') logEl.textContent = '';
    logEl.textContent = '[' + t + '] ' + msg + '\n' + logEl.textContent;
  }

  function injectBase(){
    if (window.ttq) return;
    !function (w, d, t) {
      w.TiktokAnalyticsObject = t;
      var ttq = w[t] = w[t] || [];
      ttq.methods = ["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"];
      ttq.setAndDefer = function (t, e) { t[e] = function () { t.push([e].concat(Array.prototype.slice.call(arguments, 0))); }; };
      for (var i = 0; i < ttq.methods.length; i++) ttq.setAndDefer(ttq, ttq.methods[i]);
      ttq.instance = function (t) { for (var e = ttq._i[t] || [], n = 0; n < ttq.methods.length; n++) ttq.setAndDefer(e, ttq.methods[n]); return e; };
      ttq.load = function (e, n) {
        var r = "https://analytics.tiktok.com/i18n/pixel/events.js";
        ttq._i = ttq._i || {}; ttq._i[e] = []; ttq._i[e]._u = r;
        ttq._t = ttq._t || {}; ttq._t[e] = +new Date();
        ttq._o = ttq._o || {}; ttq._o[e] = n || {};
        var s = d.createElement("script"); s.type = "text/javascript"; s.async = !0;
        s.src = r + "?sdkid=" + e + "&lib=" + t;
        var a = d.getElementsByTagName("script")[0]; a.parentNode.insertBefore(s, a);
      };
    }(window, document, 'ttq');
  }

  function setReady(id){
    $('dot').classList.add('on');
    $('st').textContent = 'Pixel ativo' + (id ? ': ' + id : ' (código base da página)');
    document.querySelectorAll('.ev').forEach(function(b){ b.disabled = false; });
  }

  // Detecta pixel já instalado na página
  if (window.ttq && window.ttq._i && Object.keys(window.ttq._i).length) {
    var existing = Object.keys(window.ttq._i)[0];
    $('pixelId').value = existing;
    setReady(existing);
    log('Pixel já presente na página: ' + existing);
  }

  $('btnLoad').onclick = function(){
    var id = $('pixelId').value.trim();
    if (!id) { alert('Cole o ID do pixel'); return; }
    if (window.ttq && ttq._i && ttq._i[id]) { setReady(id); log('Pixel já carregado.'); return; }
    injectBase();
    ttq.load(id);
    ttq.page();
    setReady(id);
    log('Pixel carregado: ' + id + ' → PageView enviado');
  };

  function identify(){
    var email = $('email').value.trim(), phone = $('phone').value.trim();
    var o = {};
    if (email) { o.email = email; o.external_id = email; }
    if (phone) { o.phone_number = phone; }
    if (Object.keys(o).length) { ttq.identify(o); return true; }
    return false;
  }

  function fire(ev){
    var val = parseFloat($('val').value) || 0;
    var params = {
      contents: [{ content_id: $('cid').value, content_name: $('cname').value, content_type: 'product', quantity: 1, price: val }],
      content_type: 'product',
      value: val,
      currency: $('cur').value
    };
    var eventId = ev.toLowerCase() + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    var matched = identify();
    ttq.track(ev, params, { event_id: eventId });
    log(ev + ' enviado' + (matched ? ' (+ advanced matching)' : '') + '\n   event_id: ' + eventId + '\n   valor: ' + val + ' ' + params.currency);
  }

  document.querySelectorAll('.ev[data-ev]').forEach(function(b){
    b.onclick = function(){ fire(b.getAttribute('data-ev')); };
  });

  $('btnFunnel').onclick = function(){
    var seq = ['ViewContent','AddToCart','InitiateCheckout','AddPaymentInfo','CompletePayment'];
    seq.forEach(function(ev, i){ setTimeout(function(){ fire(ev); }, i * 1500); });
    log('Funil iniciado…');
  };
})();
</script>
</body>
</html>
